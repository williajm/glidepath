sonar.host.url=https://sonarcloud.io
sonar.organization=williajm
sonar.projectKey=williajm_glidepath
sonar.projectName=glidepath
sonar.sources=src,scripts
sonar.tests=tests
# The operational scripts are tested and in the pytest coverage gate
# (issue #130); only the manual Monte Carlo performance harness stays
# outside the coverage metric (mirrors the omit in pyproject.toml).
sonar.coverage.exclusions=scripts/measure_mc_performance.py
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
