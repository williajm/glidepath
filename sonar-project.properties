sonar.host.url=https://sonarcloud.io
sonar.organization=williajm
sonar.projectKey=williajm_glidepath
sonar.projectName=glidepath
sonar.sources=src,scripts
sonar.tests=tests
# Scripts are analysed for issues but are process tooling, not product code:
# they have no tests, so keep them out of the coverage metric.
sonar.coverage.exclusions=scripts/**
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
