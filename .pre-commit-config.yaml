# Local enforcement of the merge gates. Install with: make hooks
#
# ruff and mypy run as local hooks via `uv run` so they always use the exact
# versions pinned in uv.lock (which satisfy the 7-day supply-chain cooldown),
# rather than separate pre-commit-managed environments.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy --strict
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        files: ^(src|tests|scripts)/.*\.pyi?$
