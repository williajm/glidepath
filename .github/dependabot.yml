# Alerts only: Dependabot opens no pull requests here.
# `open-pull-requests-limit: 0` turns off routine version updates for the
# SHA-pinned actions, and security-update PRs are turned off in the
# repository settings. Security alerts come from the dependency graph and
# do not need this file. Pins are refreshed by hand under the 7-day cooldown.
# The file stays because OpenSSF Scorecard's Dependency-Update-Tool check
# only detects Dependabot when it is present; deleting it scored that
# check 0 (code-scanning alert #8).
# Python dependencies are deliberately NOT managed here: `make deps` is
# the only sanctioned way to touch the lockfile.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
