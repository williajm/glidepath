# Deploys the GitHub Pages site (site/) on pushes to main. Actions are
# pinned to commit SHAs (supply-chain policy — tags can be moved, SHAs
# cannot). The site is plain static HTML; the build step just assembles
# the artifact from site/ plus images that already live elsewhere in the
# repo (screenshots, app icon), so nothing is duplicated in git.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - src/glidepath/gui/assets/icon_32.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble site
        run: |
          mkdir -p _site/screenshots
          cp site/index.html _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp src/glidepath/gui/assets/icon_32.png _site/favicon.png

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
