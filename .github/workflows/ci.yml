# Merge gates: every step must pass. Actions are pinned to commit SHAs
# (supply-chain policy — tags can be moved, SHAs cannot).
name: CI

# Feature work always goes through a PR (branch protection), so PR events
# cover dev; push covers main after merge (keeps badges and the Sonar main
# analysis fresh) without duplicating runs on dev.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repo, and checkouts do not
# persist credentials, so no step after checkout holds a usable token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — Sonar and the dep-age check need it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32" # Newest uv release >= 7 days old when pinned.
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      # PySide6 needs the platform's GL/EGL stack even on the offscreen
      # QPA platform the GUI smoke tests run under (tests/gui/conftest.py).
      - name: Install Qt runtime libraries (offscreen GUI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Tests with coverage (floor in pyproject [tool.coverage.report])
        run: uv run pytest

      - name: Dependency age check (7-day supply-chain cooldown)
        run: uv run python scripts/check_dep_age.py

      - name: Export lockfile for audit
        run: uv export --frozen --no-emit-project --output-file requirements-audit.txt

      - name: pip-audit (known CVEs)
        run: uv run pip-audit --disable-pip --requirement requirements-audit.txt

      # The token is scoped to the scan step only — other steps (dependency
      # install, tests, scripts) must not be able to read it. The secrets
      # context is not allowed in `if:`, so presence is computed into a step
      # output first (the token value itself never enters the environment).
      - name: Detect Sonar token
        id: sonar
        run: echo "present=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: SonarQube scan
        if: steps.sonar.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # A packaging bug must fail the PR that introduces it, not release day
  # (issue #198): both artifacts are built, each installs into its own
  # clean venv (installing the sdist builds a wheel from it, so both
  # build paths are exercised), and the same smoke script release.yml
  # runs verifies the import, the shipped UK region data files, and the
  # GUI entry point — without importing Qt on the headless runner.
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32" # Newest uv release >= 7 days old when pinned.
          enable-cache: true

      # uv_build backend, no dependency sync — the lockfile is untouched.
      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel in a clean venv
        run: |
          uv venv smoke-wheel
          uv pip install --python smoke-wheel dist/*.whl
          VIRTUAL_ENV=smoke-wheel uv run --no-project \
            python scripts/smoke_test_artifact.py

      - name: Smoke-test the sdist in a clean venv
        run: |
          uv venv smoke-sdist
          uv pip install --python smoke-sdist dist/*.tar.gz
          VIRTUAL_ENV=smoke-sdist uv run --no-project \
            python scripts/smoke_test_artifact.py

  # glidepath is a desktop app whose primary platform is Windows; the full
  # test suite (including the offscreen GUI tests and the Windows-specific
  # file-handling paths) must pass natively there, not just on Linux. Lint,
  # typing, Sonar and the supply-chain checks are platform-independent and
  # stay in the Linux job.
  tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32" # Newest uv release >= 7 days old when pinned.
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Tests with coverage
        run: uv run pytest
