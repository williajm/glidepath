# Publishes a release when a vX.Y.Z tag is pushed: the sdist/wheel and
# Windows executable are built and smoke-tested in unprivileged jobs.
# Python packages are published to PyPI via
# trusted publishing (OIDC — no stored tokens) with PEP 740 attestations,
# and only then announced as a GitHub Release with the artifacts
# attached, per the release process in docs/planning.md §4.10. The
# `pypi` environment requires manual approval and is restricted to v*
# tags. Actions are pinned to commit SHAs (supply-chain policy — tags
# can be moved, SHAs cannot).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Verifies the tag, builds the sdist/wheel, and smoke-tests the wheel
  # in a clean environment. Runs no privileged token — the build backend
  # and project code never execute in a job that can publish.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — the tag is verified against main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only commits that went through the merge gates may be released.
      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      # Fails if the tag disagrees with [project] version or CHANGELOG.md
      # has no section for it (stdlib-only script — no project sync).
      - name: Extract release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32" # Newest uv release >= 7 days old when pinned.
          enable-cache: true

      # uv_build backend, no dependency sync — the lockfile is untouched.
      - name: Build sdist and wheel
        run: uv build

      # The wheel must install and work from a clean environment before
      # anything reaches PyPI: the same smoke script CI runs on every PR
      # (scripts/smoke_test_artifact.py, issue #198) verifies the import,
      # the shipped UK region data files, and the GUI entry point — Qt
      # itself is not imported (the headless runner has no GL stack; the
      # entry point's behaviour is exercised by the CI GUI suite) — plus
      # the metadata version against the tag.
      - name: Smoke-test the wheel
        run: |
          uv venv smoke
          uv pip install --python smoke dist/*.whl
          VIRTUAL_ENV=smoke uv run --no-project \
            python scripts/smoke_test_artifact.py \
            --expect-version "${GITHUB_REF_NAME#v}"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  # Compilation only runs for a release tag, after build validates its
  # ancestry, version and changelog. No publish permissions or secrets.
  build-windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked build dependencies
        run: uv sync --locked --no-dev --group binary

      - name: Build folder bundle
        run: uv run --locked --no-dev --group binary python scripts/build_binary.py

      - name: Test relocated folder bundle without Python on PATH
        run: >-
          pwsh -NoProfile -File scripts/test_binary.ps1
          -Executable build/nuitka/glidepath_binary.dist/glidepath.exe
          -Report build/nuitka/smoke-standalone.json

      - name: Build single executable
        run: uv run --locked --no-dev --group binary python scripts/build_binary.py --mode onefile

      - name: Stage the versioned executable
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Path windows-release | Out-Null
          Copy-Item build/nuitka/glidepath.exe "windows-release/glidepath-$version-windows-x64.exe"

      - name: Test the release executable and verify its version
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          pwsh -NoProfile -File scripts/test_binary.ps1 `
            -Executable "windows-release/glidepath-$version-windows-x64.exe" `
            -Report build/nuitka/smoke-onefile.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content build/nuitka/smoke-onefile.json -Raw | ConvertFrom-Json
          if ($report.version -ne $version) {
            throw "Executable version $($report.version) does not match release $version"
          }

      - name: Upload tested Windows release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-assets
          path: windows-release/*.exe
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-diagnostics
          path: |
            build/nuitka/compilation-report.xml
            build/nuitka/smoke-*.json
          if-no-files-found: ignore

  # Publishes to PyPI via trusted publishing: the job's OIDC token is
  # exchanged for a short-lived upload token, so no PyPI credential is
  # stored in the repo. This job checks out nothing and runs no project
  # code — it only downloads the built artifacts and uploads them. The
  # pypa action generates PEP 740 attestations by default under trusted
  # publishing. The `pypi` environment name is part of the trust
  # contract registered on PyPI; its protection rules (required
  # reviewer, v* tags only) gate this job.
  publish-pypi:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/glidepath/
    permissions:
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Publish to PyPI (trusted publishing + attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The GitHub Release is created only after PyPI publication succeeds,
  # so a failed upload never leaves a public release advertising a
  # package that is not there. The sdist/wheel and Windows exe are attached
  # so the release carries the exact published artifacts, and signed build
  # provenance is attested for them first — the GitHub-side mirror of
  # the PEP 740 attestations PyPI holds, so a download from the release
  # page verifies with `gh attestation verify <file> -R <repo>`. Like
  # publish-pypi, this job checks out nothing and runs no project code.
  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Download the tested Windows executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-assets
          path: windows

      - name: Attest build provenance for the release artifacts
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*
            windows/*.exe

      # The signed Sigstore bundle lives in GitHub's attestation store,
      # which is invisible on the release page (and to Scorecard's
      # Signed-Releases check, which reads only asset filenames).
      # Attaching the same bundle as a *.intoto.jsonl asset makes the
      # provenance visible alongside the artifacts and verifiable
      # offline (`gh attestation verify --bundle`).
      - name: Stage the attestation bundle as a release asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "glidepath-${GITHUB_REF_NAME#v}-provenance.intoto.jsonl"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "glidepath $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/* \
            windows/*.exe \
            glidepath-*-provenance.intoto.jsonl
